[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phost-score"
version = "0.1.0.dev0"
description = "Judging rules by swap class, a Pareto board and a hash-chained local ledger for phost run results. No GPU needed."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
lab = ["phost", "phost-lab"]
test = ["pytest>=7"]

[project.scripts]
phost-score = "phost_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
